[package]
name = "rec"
version = "0.4.1"
edition = "2024"
description = "Quick speech-to-text for devs"

[[bin]]
name = "rec"
path = "src/main.rs"

[features]
# Local transcription with the MLX Voxtral model (--local). Apple Silicon
# only; pulls in the full MLX build (requires Xcode's Metal toolchain).
local = ["dep:voxtral-mlx", "dep:mlx-rs", "dep:hf-hub"]

[dependencies]
arboard = "3.6.1"
voxtral-mlx = { git = "https://github.com/max-lt/voxtral-mlx-rs", rev = "a9592e8d03ac877eb8d861317babe91b8212c794", optional = true }
mlx-rs = { git = "https://github.com/oxideai/mlx-rs", optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }
clap = { version = "4", features = ["derive"] }
cpal = "0.17"
hound = "3.5.1"
reqwest = { version = "0.13", features = ["multipart", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
